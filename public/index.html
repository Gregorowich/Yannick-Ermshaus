<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>J.A.R.V.I.S.</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <h1>J.A.R.V.I.S.</h1>

      <!-- Die leuchtende Kugel (Arc-Reactor-Look). Klassen steuern den Zustand. -->
      <button id="orb" class="orb sleeping" aria-label="Jarvis aktivieren">
        <span class="ring"></span>
        <span class="core"></span>
      </button>

      <p id="status" class="status">Initialisiere …</p>

      <div id="transcript-area" class="bubbles">
        <p id="you" class="bubble you hidden"></p>
        <p id="jarvis" class="bubble jarvis hidden"></p>
      </div>

      <p class="hint">
        Sag <strong>„Jarvis"</strong> und stelle deine Frage – oder klicke auf die Kugel.
      </p>
    </main>

    <audio id="player" hidden></audio>
    <script type="module" src="/app.js"></script>
  </body>
</html>
