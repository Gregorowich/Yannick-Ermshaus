<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>J.A.R.V.I.S.</title>
    <meta name="theme-color" content="#04080f" />
    <!-- Als App auf den iPad-Home-Bildschirm -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Jarvis" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <!-- Sci-Fi-Schrift (mit System-Fallback, falls offline) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <!-- Animierter HUD-Hintergrund -->
    <canvas id="hud"></canvas>

    <main>
      <h1 class="title">J.A.R.V.I.S.</h1>

      <!-- Die stimm-reaktive Kugel (Arc-Reactor / HUD-Look) -->
      <button id="orb" class="orb sleeping" aria-label="Jarvis aktivieren">
        <span class="ring ring-outer"></span>
        <span class="ring ring-mid"></span>
        <span class="reticle"></span>
        <span class="core"></span>
        <span class="glow"></span>
      </button>

      <p id="status" class="status">Initialisiere …</p>

      <div id="transcript-area" class="bubbles">
        <p id="you" class="bubble you hidden"></p>
        <p id="jarvis" class="bubble jarvis hidden"></p>
      </div>

      <p class="hint">
        Sag <strong>„Jarvis"</strong> und stelle deine Frage – oder tippe auf die Kugel.
      </p>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
