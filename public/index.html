<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>J.A.R.V.I.S.</title>
    <meta name="theme-color" content="#04080f" />
    <!-- Als App auf den iPad-Home-Bildschirm -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Jarvis" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <h1>J.A.R.V.I.S.</h1>

      <!-- Die leuchtende Kugel (Arc-Reactor-Look). Klassen steuern den Zustand. -->
      <button id="orb" class="orb sleeping" aria-label="Jarvis aktivieren">
        <span class="ring"></span>
        <span class="core"></span>
      </button>

      <p id="status" class="status">Initialisiere …</p>

      <div id="transcript-area" class="bubbles">
        <p id="you" class="bubble you hidden"></p>
        <p id="jarvis" class="bubble jarvis hidden"></p>
      </div>

      <p class="hint">
        Sag <strong>„Jarvis"</strong> und stelle deine Frage – oder tippe auf die Kugel.
      </p>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
